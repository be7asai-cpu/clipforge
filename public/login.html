<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1924" />
    <meta name="google-adsense-account" content="ca-pub-4395681148586201" />
    <meta
      name="description"
      content="ClipForge — lokalne studio wideo: usuwanie logo, HD, lektor i napisy. Zaloguj się i pracuj na swoim PC."
    />
    <title>ClipForge — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Exo+2:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <meta http-equiv="Cache-Control" content="no-store" />
    <!-- Critical theme: dark HUD even if CSS loads late (Render free cold start) -->
    <style>
      html, body.auth-body {
        margin: 0;
        min-height: 100vh;
        background: #02060f !important;
        color: #e0f7ff !important;
        font-family: "Exo 2", system-ui, sans-serif;
      }
      body.auth-body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-image:
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 80, 120, 0.25), transparent),
          linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px) !important;
        background-size: 100% 100%, 40px 40px, 40px 40px !important;
      }
      .auth-card {
        background: rgba(0, 20, 40, 0.75) !important;
        border: 1px solid rgba(0, 240, 255, 0.35) !important;
        color: #e0f7ff !important;
      }
      .auth-card input {
        background: rgba(0, 15, 30, 0.8) !important;
        border: 1px solid rgba(0, 240, 255, 0.3) !important;
        color: #e0f7ff !important;
      }
      .oauth-btn.disabled {
        opacity: 0.45;
      }
    </style>
    <link rel="stylesheet" href="/css/studio.css?v=20260803ads" />
    <link rel="stylesheet" href="/css/auth.css?v=20260803ads" />
    <link rel="icon" href="/assets/clipforge-192.png" />
    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4395681148586201"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="auth-body">
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="glow-orb orb1" aria-hidden="true"></div>
    <div class="glow-orb orb2" aria-hidden="true"></div>

    <div class="auth-lang-bar">
      <div id="ui-lang-slot" class="ui-lang-slot"></div>
    </div>

    <main class="auth-wrap">
      <section class="auth-card">
        <a class="auth-brand" href="/login.html">
          <img src="/assets/clipforge_logo.jpg" alt="ClipForge" />
          <span>
            <strong>ClipForge</strong>
            <small>FacePub</small>
          </span>
        </a>

        <h1 id="auth-title" data-i18n="login.title">Zaloguj się do ClipForge</h1>
        <p class="auth-sub" id="auth-sub" data-i18n="login.sub">
          Wejście do Studio: e-mail + hasło (wymagana aktywacja).
        </p>

        <div id="auth-error" class="auth-error hidden" role="alert"></div>
        <div id="auth-ok" class="auth-ok hidden" role="status"></div>

        <div class="auth-oauth" id="oauth-row">
          <a class="oauth-btn oauth-google disabled" id="btn-google" href="#" title="Google">
            <span class="oauth-icon" aria-hidden="true">G</span>
            <span data-i18n="login.google">Kontynuuj z Google</span>
          </a>
          <a class="oauth-btn oauth-facebook disabled" id="btn-facebook" href="#" title="Facebook">
            <span class="oauth-icon" aria-hidden="true">f</span>
            <span data-i18n="login.facebook">Kontynuuj z Facebook</span>
          </a>
        </div>

        <div class="auth-divider"><span data-i18n="login.orEmail">lub e-mail</span></div>

        <form id="auth-form" class="auth-form" novalidate>
          <label class="auth-field" id="name-field" hidden>
            <span data-i18n="login.name">Imię / nazwa</span>
            <input type="text" id="name" name="name" autocomplete="name" />
          </label>

          <label class="auth-field">
            <span data-i18n="login.email">E-mail</span>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              placeholder="you@email.com"
            />
          </label>

          <label class="auth-field">
            <span data-i18n="login.password">Hasło</span>
            <input
              type="password"
              id="password"
              name="password"
              required
              minlength="8"
              autocomplete="current-password"
              data-i18n-placeholder="login.passPh"
              placeholder="min. 8 znaków"
            />
          </label>

          <button type="submit" class="auth-submit" id="btn-submit" data-i18n="login.submit">
            Zaloguj
          </button>
        </form>

        <p class="auth-switch" id="auth-switch-row">
          <span id="switch-text" data-i18n="login.noAccount">Nie masz konta?</span>
          <button type="button" class="link-btn" id="btn-toggle" data-i18n="login.switchReg">
            Zarejestruj się
          </button>
        </p>

        <p class="auth-switch" id="forgot-row">
          <button type="button" class="link-btn" id="btn-forgot">
            Nie pamiętam hasła
          </button>
        </p>

        <p class="auth-hint" id="oauth-hint"></p>
      </section>

      <!-- Widoczna reklama pod logowaniem (publiczna strona) -->
      <div class="cf-ad cf-ad-login" data-cf-ad="banner" data-min-h="100px" aria-label="Reklama">
        <div class="cf-ad-label">Reklama</div>
        <div class="cf-ad-hint">Ładowanie AdSense…</div>
        <ins
          class="adsbygoogle"
          style="display: block; min-height: 90px"
          data-ad-client="ca-pub-4395681148586201"
          data-ad-format="auto"
          data-full-width-responsive="true"
        ></ins>
      </div>
    </main>

    <script src="/js/i18n.js?v=20260803ads"></script>
    <script src="/js/auth-page.js?v=20260803ads"></script>
    <script src="/js/adsense-init.js?v=20260803ads"></script>
    <script>
      (function () {
        const I = window.ClipForgeI18n;
        if (!I) return;
        I.mountSwitcher(document.getElementById("ui-lang-slot"));
        I.apply();
        window.addEventListener("clipforge:lang", () => I.apply());
      })();
    </script>
  </body>
</html>
